<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>독서 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one centered card, one question at a time, like a page in a reading notebook. Palette from rice cakes: mugwort green, azalea pink, rice white. */
:root {
  --bg: #f6f4ee;
  --card: #ffffff;
  --fg: #2b2e27;
  --muted: #6c7064;
  --line: #dfddd2;
  --accent: #5d8a3a;
  --accent-ink: #ffffff;
  --pink: #d9607e;
  --pink-soft: #fbe6ec;
  --green-soft: #e8f0de;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1d18; --card: #25281f; --fg: #ecebe3; --muted: #a6a99c; --line: #3a3d33;
    --accent: #8dbb63; --accent-ink: #172010; --pink: #ef8aa3; --pink-soft: #3a2329; --green-soft: #2c3523;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding: 32px 16px 48px;
}
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }
header { display: grid; gap: 4px; }
.book { color: var(--muted); font-size: 15px; letter-spacing: .02em; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1.15; margin: 0; text-wrap: balance; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 28px 24px; display: grid; gap: 18px;
}
h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.3; margin: 0; text-wrap: balance; }
label { font-size: 15px; color: var(--muted); }
input[type="text"] {
  width: 100%; font: inherit; font-size: 20px; color: var(--fg); background: var(--bg);
  border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
input[type="text"]:focus { outline: none; border-color: var(--accent); }
.field { display: grid; gap: 6px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
button {
  font-family: var(--font-display); font-size: 20px; border: 0; border-radius: 12px;
  padding: 12px 22px; cursor: pointer; background: var(--accent); color: var(--accent-ink);
}
button.ghost { background: transparent; color: var(--muted); border: 2px solid var(--line); }
button.small { font-size: 16px; padding: 8px 14px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
.hint { color: var(--pink); font-size: 15px; min-height: 1.4em; margin: 0; }
.dots { display: flex; gap: 8px; align-items: center; }
.dot { width: 34px; height: 14px; border-radius: 999px; background: var(--line); transition: background .2s; }
.dot.done { background: var(--accent); }
.dot.now { background: var(--pink); }
.step { font-family: var(--font-display); color: var(--muted); font-size: 18px; margin-left: auto; font-variant-numeric: tabular-nums; }
.score-big { font-family: var(--font-display); font-size: 64px; line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
.score-big small { font-size: 28px; color: var(--muted); }
.rank { background: var(--pink-soft); border-radius: 14px; padding: 14px 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.rank b { font-family: var(--font-display); font-weight: 400; font-size: 36px; color: var(--pink); font-variant-numeric: tabular-nums; }
.rank span { color: var(--muted); flex: 1; min-width: 0; }
.review { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.review li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.review li.ok { background: var(--green-soft); }
.mark { font-family: var(--font-display); font-size: 22px; line-height: 1.2; }
.ok .mark { color: var(--accent); }
.no .mark { color: var(--pink); }
.review .q { font-size: 15px; color: var(--muted); }
.review .a { min-width: 0; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .dot { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="book">『만복이네 떡집』 함께 읽고</div>
    <h1>독서 퀴즈</h1>
  </header>

  <form class="card" id="start" autocomplete="off">
    <h2>이름을 적고 퀴즈를 시작해요</h2>
    <div class="field">
      <label for="name">내 이름</label>
      <input type="text" id="name" maxlength="20" placeholder="예: 김하늘">
    </div>
    <p class="hint" id="startHint"></p>
    <div class="row">
      <span class="book">문제 4개 · 한 문제씩 풀어요</span>
      <button type="submit">시작하기</button>
    </div>
  </form>

  <form class="card" id="quiz" autocomplete="off" hidden>
    <div class="dots" id="dots"></div>
    <h2 id="question"></h2>
    <div class="field">
      <label for="answer">내 답</label>
      <input type="text" id="answer" maxlength="40">
    </div>
    <p class="hint" id="quizHint"></p>
    <div class="row">
      <button type="button" class="ghost" id="prev">이전</button>
      <button type="submit" id="next">다음</button>
    </div>
  </form>

  <section class="card" id="result" hidden>
    <div class="book" id="resultName"></div>
    <p class="score-big"><span id="score"></span><small> / 100점</small></p>
    <div class="rank">
      <b id="rank">…</b>
      <span id="rankSub">점수를 저장하고 있어요</span>
      <button type="button" class="ghost small" id="refresh" hidden>순위 새로고침</button>
    </div>
    <ul class="review" id="review"></ul>
  </section>
</div>

<script>
// Supabase 연결 정보 (publishable 키는 브라우저에 넣어도 되는 공개용 키예요)
const SUPABASE_URL = "https://dbsfxidrootugwhcdomw.supabase.co";
const SUPABASE_KEY = "sb_publishable_H_GpQ6l8d4YO7iHbdpBVGA_95duSLRW";
const API = SUPABASE_URL + "/rest/v1/scores";
const HEADERS = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };

const QUESTIONS = [
  { q: "주인공의 이름은?", answer: "만복이", accept: ["만복이", "만복"] },
  { q: "책 제목은?", answer: "만복이네 떡집", accept: ["만복이네떡집"] },
  { q: "주인공이 가장 좋아하는 음식은?", answer: "떡", accept: ["떡"] },
  { q: "주인공의 성별은?", answer: "남자", accept: ["남자", "남", "남자아이", "남학생", "남성"] },
];
const norm = s => s.replace(/\s+/g, "").trim();
const isRight = (i, a) => QUESTIONS[i].accept.map(norm).includes(norm(a));

const $ = id => document.getElementById(id);
let name = "", idx = 0, answers = QUESTIONS.map(() => ""), myScore = 0;

$("start").addEventListener("submit", e => {
  e.preventDefault();
  name = $("name").value.trim();
  if (!name) { $("startHint").textContent = "이름을 먼저 적어 주세요."; $("name").focus(); return; }
  $("start").hidden = true; $("quiz").hidden = false;
  showQuestion();
});

function showQuestion() {
  $("dots").innerHTML = QUESTIONS.map((_, i) =>
    `<span class="dot ${i < idx ? "done" : i === idx ? "now" : ""}"></span>`).join("") +
    `<span class="step">${idx + 1} / ${QUESTIONS.length}</span>`;
  $("question").textContent = `${idx + 1}. ${QUESTIONS[idx].q}`;
  $("answer").value = answers[idx];
  $("quizHint").textContent = "";
  $("prev").disabled = idx === 0;
  $("next").textContent = idx === QUESTIONS.length - 1 ? "답 제출하기" : "다음";
  $("answer").focus();
}

$("prev").addEventListener("click", () => {
  answers[idx] = $("answer").value.trim();
  if (idx > 0) { idx--; showQuestion(); }
});

$("quiz").addEventListener("submit", e => {
  e.preventDefault();
  const a = $("answer").value.trim();
  if (!a) { $("quizHint").textContent = "답을 적어 주세요."; $("answer").focus(); return; }
  answers[idx] = a;
  if (idx < QUESTIONS.length - 1) { idx++; showQuestion(); return; }
  finish();
});

async function finish() {
  $("next").disabled = true;
  const correct = answers.filter((a, i) => isRight(i, a)).length;
  myScore = correct * 25;
  $("quiz").hidden = true; $("result").hidden = false;
  $("resultName").textContent = `${name}의 점수 · ${QUESTIONS.length}문제 중 ${correct}문제 정답`;
  $("score").textContent = myScore;
  QUESTIONS.forEach((item, i) => {
    const ok = isRight(i, answers[i]);
    const li = document.createElement("li");
    li.className = ok ? "ok" : "no";
    li.innerHTML = `<span class="mark">${ok ? "O" : "X"}</span><div class="a"><div class="q"></div><div class="v"></div></div>`;
    li.querySelector(".q").textContent = `${i + 1}. ${item.q}`;
    li.querySelector(".v").textContent = ok ? answers[i] : `내 답: ${answers[i]} → 정답: ${item.answer}`;
    $("review").appendChild(li);
  });

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { ...HEADERS, Prefer: "return=minimal" },
      body: JSON.stringify({ name, score: myScore, answers }),
    });
    if (!res.ok) throw new Error(res.status);
    await loadRank();
  } catch (err) {
    setRank("–", "점수를 저장하지 못했어요. 선생님께 알려 주세요.");
  }
}

async function loadRank() {
  try {
    const res = await fetch(API + "?select=score", { headers: HEADERS });
    if (!res.ok) throw new Error(res.status);
    const scores = (await res.json()).map(r => Number(r.score) || 0);
    const higher = scores.filter(s => s > myScore).length;
    const same = scores.filter(s => s === myScore).length;
    const tie = same > 1 ? ` · 같은 점수 ${same}명` : "";
    setRank(`${higher + 1}등`, `제출한 ${scores.length}명 중${tie}`);
    $("refresh").hidden = false;
  } catch (err) {
    setRank("–", "순위를 불러오지 못했어요. 잠시 후 새로고침을 눌러 주세요.");
    $("refresh").hidden = false;
  }
}

$("refresh").addEventListener("click", loadRank);

function setRank(big, sub) {
  $("rank").textContent = big;
  $("rankSub").textContent = sub;
}
</script>
</body>
</html>
